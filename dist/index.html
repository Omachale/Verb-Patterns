<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Escape from Luke's Class</title>
<meta name="description" content="Type the right verb form to escape the classroom.">
<meta name="theme-color" content="#2b2433">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css?v=4">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="app">
  <div id="stage">
    <!-- Testing tools: only shown when the address ends in ?debug -->
    <div id="debug" hidden>
      <span class="dlabel">debug</span>
      <button data-dbg="right">✓</button>
      <button data-dbg="wrong">✗</button>
      <button data-dbg="pause">⏸</button>
      <button data-dbg="reset">↺</button>
    </div>
    <button id="mute" aria-label="Toggle sound">🔊</button>
    <div id="bubble"></div>
    <div id="vignette"></div>
    <div id="closeup"><img src="assets/teacher-closeup.webp" alt="The teacher, furious"><span>!!</span></div>
    <div id="picker" hidden>
      <div class="game-title">Escape from Luke's Class</div>
      <p class="how">Type the missing verb — <b>to&nbsp;eat</b> or <b>eating</b>? Right answers move you towards the door. Wrong or slow ones move you towards Luke…</p>
      <div class="picker-title">Choose your student</div>
      <div class="choices"></div>
    </div>
    <div id="card" hidden>
      <div class="card-title"></div>
      <div class="card-stats"></div>
      <div class="card-mistakes"></div>
      <div class="card-buttons">
        <button id="again">Play again</button>
        <button id="change">Change character</button>
        <button id="shot" aria-label="Save a picture of your result">📷</button>
      </div>
    </div>
  </div>
  <div id="hud">
    <div id="track"></div>
    <div id="timer"><div></div></div>
    <div id="sentence"></div>
  </div>
  <div id="kb"></div>
</div>
<script type="module" src="src/main.js?v=4"></script>
</body>
</html>
